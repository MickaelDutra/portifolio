<section id="hero" class="hero">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-radials" aria-hidden="true"></div>

  <div class="container hero-inner">

    <div class="hero-text">
      <div class="availability-badge">
        <span class="dot"></span>
        Disponível para projetos
      </div>

      <h1>
        Olá, eu sou<br>
        <span class="name-gradient">Mickael Dutra</span>
      </h1>

      <p class="typewriter-line">
        <span class="role-text">{{ displayedRole }}</span>
        <span class="cursor" aria-hidden="true">|</span>
      </p>

      <p class="hero-desc">
        Transformo ideias em experiências digitais memoráveis. Especialista em criar
        interfaces modernas e performáticas com foco total na experiência do usuário.
      </p>

      <div class="hero-cta">
        <button class="btn btn-primary" (click)="scrollTo('#projetos')">
          <i class="bi bi-grid-3x3-gap-fill"></i>
          Ver Projetos
        </button>
        <button class="btn btn-outline" (click)="scrollTo('#contato')">
          <i class="bi bi-chat-dots"></i>
          Entrar em Contato
        </button>
      </div>

      <div class="social-row">
        <a href="https://github.com/MickaelDutra"                         target="_blank" rel="noopener" title="GitHub">
          <i class="bi bi-github"></i>
        </a>
        <a href="https://www.linkedin.com/in/mickael-dutra-690970258/"    target="_blank" rel="noopener" title="LinkedIn">
          <i class="bi bi-linkedin"></i>
        </a>
        <a href="https://www.instagram.com/mickael_dutra05/"              target="_blank" rel="noopener" title="Instagram">
          <i class="bi bi-instagram"></i>
        </a>
        <a href="mailto:mickaeldutra99@gmail.com"                         title="E-mail">
          <i class="bi bi-envelope-fill"></i>
        </a>
      </div>
    </div>

    <div class="hero-photo">
      <div class="photo-wrap">
        <div class="photo-glow" aria-hidden="true"></div>
        <img src="images/foto_portifolio.jpg" alt="Foto de perfil de Mickael Dutra">

        <div class="chip chip-a">
          <i class="bi bi-code-slash"></i>
          <span>1+ Ano</span>
        </div>
        <div class="chip chip-b">
          <i class="bi bi-star-fill"></i>
          <span>10+ Projetos</span>
        </div>
      </div>
    </div>

  </div>

  <button class="scroll-hint" (click)="scrollTo('#sobre')" aria-label="Rolar para baixo">
    <span>Scroll</span>
    <div class="scroll-track"><div class="scroll-thumb"></div></div>
  </button>
</section>
