<header [class.scrolled]="isScrolled()">
  <nav class="container">

    <button class="logo" (click)="go('#hero')">
      <span class="brackets">&lt;</span>MD<span class="brackets">/&gt;</span>
    </button>

    <ul class="nav-links">
      @for (item of navItems; track item.href) {
        <li><button (click)="go(item.href)">{{ item.label }}</button></li>
      }
    </ul>

    <button class="btn btn-primary hire-btn" (click)="go('#contato')">
      <i class="bi bi-envelope"></i> Contratar
    </button>

    <button class="hamburger" [class.open]="menuOpen()" (click)="toggle()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>

  </nav>

  <div class="drawer" [class.open]="menuOpen()">
    <ul>
      @for (item of navItems; track item.href) {
        <li><button (click)="go(item.href)">{{ item.label }}</button></li>
      }
      <li>
        <button class="btn btn-primary drawer-cta" (click)="go('#contato')">
          <i class="bi bi-envelope"></i> Contratar
        </button>
      </li>
    </ul>
  </div>
  @if (menuOpen()) {
    <div class="overlay" (click)="close()"></div>
  }
</header>
